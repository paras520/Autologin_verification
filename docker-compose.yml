services:
  autologin:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Selects the environment block from app.config.json
      APP_ENV: stage1
      # Connect directly to the m103 postgres container via the shared network.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@m103-postgres-local:5432/whitelist_db
    restart: unless-stopped
    networks:
      - default
      - m103-network

networks:
  m103-network:
    external: true
    name: m103_whitelist_management_m103-network
