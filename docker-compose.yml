services:
  autologin:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Connect directly to the m103 postgres container via the shared network.
      DATABASE_URL: postgresql://postgres:postgres123@m103-postgres-local:5432/whitelist_db
      # Point at the m103 backend container via the shared network.
      M103_BASE_URL: http://m103-backend-local:8001
    restart: unless-stopped
    networks:
      - default
      - m103-network

networks:
  m103-network:
    external: true
    name: m103_whitelist_management_m103-network
